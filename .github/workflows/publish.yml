name: Build and publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # tikzc v1.3.0; pin the source as well as its Cargo.lock dependencies.
  TIKZC_REV: cd1df4ceca054cd9d477510d7161170d0070a4aa
  RUST_VERSION: 1.99.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install Python and book dependencies
        run: |
          uv python install
          uv sync --locked --group book
          echo "QUARTO_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"

      - name: Set up Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Cache tikzc installation
        id: tikzc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tikzc
          key: tikzc-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.TIKZC_REV }}

      - name: Install tikzc with Cargo
        if: steps.tikzc-cache.outputs.cache-hit != 'true'
        run: >-
          cargo +"$RUST_VERSION" install
          --git https://github.com/RyoNakagami/tikzc
          --rev "$TIKZC_REV" --locked
          --root "$HOME/.local/tikzc" tikzc

      - name: Add tikzc to PATH
        run: echo "$HOME/.local/tikzc/bin" >> "$GITHUB_PATH"

      - name: Verify figure compiler and run tests
        run: |
          tikzc --version
          uv run --locked --group book python -m unittest discover -s tests -v

      - name: Compile figures and render the book
        run: uv run --locked --group book quarto render --to all

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
